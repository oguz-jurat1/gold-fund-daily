name: 金价每10元预警

# 每天检查 4 次，只在跌破 700 元/克时推送，否则静默
on:
  schedule:
    # 北京时间 08:00-23:00 每 30 分钟一次（UTC 0-15 点）
    - cron: "*/30 0-15 * * *"
  workflow_dispatch: {} # 手动触发用于验证

permissions:
  contents: write

concurrency:
  group: gold-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install --quiet certifi

      - name: 检查金价（跌破才推送）
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          TZ: Asia/Shanghai
        run: python scripts/market_snapshot.py --mode pm --alert-only --push --no-save

      - name: 保存预警状态（已报档位，防止重复推送）
        run: |
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add data/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "状态无变化"
          else
            git commit -m "chore: 更新金价预警档位记录"
            git push
          fi

      - name: 失败时输出诊断
        if: failure()
        run: |
          echo "### 金价检查失败" >> $GITHUB_STEP_SUMMARY
          curl -s -m 15 -o /dev/null -w "新浪行情接口 HTTP %{http_code}\n" \
            -H "Referer: https://finance.sina.com.cn" \
            "https://hq.sinajs.cn/list=gds_AUTD" >> $GITHUB_STEP_SUMMARY || true
